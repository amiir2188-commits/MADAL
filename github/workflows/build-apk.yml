
name: Build MADAL Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download MADAL source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare MADAL Android project
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.webmanifest www/ 2>/dev/null || true
          cp sw.js www/ 2>/dev/null || true
          cp -r icons www/ 2>/dev/null || true
          npm init -y
          npm install @capacitor/core
          npm install -D @capacitor/cli
          npx cap init MADAL com.madal.app --web-dir www
          npm install @capacitor/android
          npx cap add android
          npx cap sync android

      - name: Build MADAL APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save MADAL APK
        uses: actions/upload-artifact@v4
        with:
          name: MADAL-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
