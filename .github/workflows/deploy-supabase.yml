name: Deploy GoGol Supabase backend

on:
  workflow_dispatch:
    inputs:
      preflight_only:
        description: "Safely validate Supabase secrets and preview pending migrations without changing production"
        required: true
        type: boolean
        default: true
      confirm_production_deploy:
        description: "I confirm this will apply pending SQL migrations to the live GoGol Supabase project"
        required: true
        type: boolean
        default: false
      backup_completed:
        description: "I have a recent, restorable backup of the production database"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gogol-supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.preflight_only || (inputs.confirm_production_deploy && inputs.backup_completed) }}
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.preflight_only && 'preflight' || 'production' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      GOGOL_CRON_SECRET: ${{ secrets.GOGOL_CRON_SECRET }}
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      SUPABASE_PROJECT_ID: nxtnfdyksskofjbvface
    steps:
      - name: Checkout GoGol
        uses: actions/checkout@v7

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN repository/environment secret"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing SUPABASE_DB_PASSWORD repository/environment secret"; exit 1; }
          test -n "$GOGOL_CRON_SECRET" || { echo "Missing GOGOL_CRON_SECRET repository/environment secret"; exit 1; }
          test -d supabase/migrations
          test -f supabase/functions/delete-account/index.ts
          test -f supabase/functions/cleanup-expired-stories/index.ts
          test -f supabase/functions/live-token/index.ts

      - name: Link production project
        shell: bash
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Preview database migrations
        shell: bash
        run: supabase db push --linked --dry-run

      - name: Report preflight-only result
        if: inputs.preflight_only
        run: |
          echo "Preflight succeeded. No production database changes or Edge Function deployments were made."
          echo "To deploy, run this workflow again with preflight_only=false, confirm_production_deploy=true, and backup_completed=true after verifying a restorable backup."

      - name: Apply reviewed database migrations
        if: ${{ !inputs.preflight_only && inputs.confirm_production_deploy && inputs.backup_completed }}
        shell: bash
        run: supabase db push --linked --yes

      - name: Deploy secure Edge Functions
        if: ${{ !inputs.preflight_only && inputs.confirm_production_deploy && inputs.backup_completed }}
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy delete-account --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy cleanup-expired-stories --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy live-token --project-ref "$SUPABASE_PROJECT_ID"

      - name: Configure expired Stories cleanup secret
        if: ${{ !inputs.preflight_only && inputs.confirm_production_deploy && inputs.backup_completed }}
        shell: bash
        run: supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" "CRON_SECRET=$GOGOL_CRON_SECRET"

      - name: Configure optional LiveKit credentials
        if: ${{ !inputs.preflight_only && inputs.confirm_production_deploy && inputs.backup_completed && env.LIVEKIT_URL != '' && env.LIVEKIT_API_KEY != '' && env.LIVEKIT_API_SECRET != '' }}
        shell: bash
        run: supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" "LIVEKIT_URL=$LIVEKIT_URL" "LIVEKIT_API_KEY=$LIVEKIT_API_KEY" "LIVEKIT_API_SECRET=$LIVEKIT_API_SECRET"

      - name: Report optional service configuration
        if: ${{ !inputs.preflight_only && inputs.confirm_production_deploy && inputs.backup_completed }}
        shell: bash
        run: |
          echo "Core backend migrations and account/story/LIVE token functions deployed."
          echo "LiveKit credentials: $([ -n "$LIVEKIT_URL" ] && [ -n "$LIVEKIT_API_KEY" ] && [ -n "$LIVEKIT_API_SECRET" ] && echo configured || echo not-configured)"
          echo "In Supabase Dashboard > Integrations > Cron, schedule POST /functions/v1/cleanup-expired-stories every 15 minutes."
          echo "Set Authorization: Bearer <the same GOGOL_CRON_SECRET> and Content-Type: application/json."
