name: Build GoGol Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: madal-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build GoGol APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout GoGol
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare GoGol
        run: |
          test -f index.html
          test -f account.html
          mkdir -p assets www
          cp icon-only.png assets/icon-only.png
          cp icon-foreground.png assets/icon-foreground.png
          cp icon-background.png assets/icon-background.png
          cp splash.png assets/splash.png
          cp index.html account.html update.js live.js www/
          cp manifest.webmanifest version.json www/ 2>/dev/null || true
          cp sw.js www/ 2>/dev/null || true
          cp -r icons www/ 2>/dev/null || true
          npm init -y
          npm install @capacitor/core @capacitor/android @capawesome/capacitor-live-update
          npm install --save-dev esbuild
          npm install --save-dev @capacitor/cli @capacitor/assets sharp
          npx cap init GoGol com.madal.app --web-dir www
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));p.plugins={...(p.plugins||{}),LiveUpdate:{autoUpdateStrategy:'none',readyTimeout:10000}};fs.writeFileSync('capacitor.config.json',JSON.stringify(p,null,2));"
          npx cap add android
          node <<'NODE'
          const fs = require('fs');
          const file = 'android/app/src/main/AndroidManifest.xml';
          let manifest = fs.readFileSync(file, 'utf8');
          const declarations = [
            '<uses-permission android:name="android.permission.CAMERA" />',
            '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
            '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
            '<uses-feature android:name="android.hardware.camera" android:required="false" />',
            '<uses-feature android:name="android.hardware.camera.flash" android:required="false" />'
          ];
          for (const declaration of declarations) {
            if (!manifest.includes(declaration)) {
              manifest = manifest.replace(/<manifest\b[^>]*>/, tag => tag + '\n    ' + declaration);
            }
          }
          fs.writeFileSync(file, manifest);
          NODE
          GOGOL_VERSION="$(node -e "console.log(require('./version.json').version)")"
          GOGOL_VERSION_CODE="$(node -e "const [a,b,c]=require('./version.json').version.split('.').map(Number);console.log(a*1000000+b*1000+c)")"
          export GOGOL_VERSION GOGOL_VERSION_CODE
          node <<'NODE'
          const fs = require('fs');
          const file = 'android/app/build.gradle';
          let gradle = fs.readFileSync(file, 'utf8');
          gradle = gradle.replace(/versionCode\s+\d+/, 'versionCode ' + process.env.GOGOL_VERSION_CODE);
          gradle = gradle.replace(/versionName\s+["'][^"']+["']/, 'versionName "' + process.env.GOGOL_VERSION + '"');
          fs.writeFileSync(file, gradle);
          NODE
          node -e "require('sharp')('gogol-logo.svg').resize(1024,1024,{fit:'contain',background:{r:0,g:0,b:0,alpha:0}}).png().toFile('assets/icon-only.png').then(()=>require('sharp')('assets/icon-only.png').png().toFile('assets/icon-foreground.png'))"
          npx capacitor-assets generate --android
          # Bundle the native live-update plugin before Capacitor copies web assets.
          npx esbuild update.js --bundle --format=esm --outfile=www/update.js
          npx cap sync android
          test -s android/app/src/main/assets/public/update.js
          if grep -qE "from ['\"]@capawesome/capacitor-live-update['\"]|import\(['\"]@capawesome/capacitor-live-update['\"]\)" android/app/src/main/assets/public/update.js; then
            echo "Unbundled native update plugin import found in Android assets."
            exit 1
          fi
          cd www && zip -r ../madal-web.zip . && cd ..

      - name: Validate app JavaScript
        run: |
          node --check live.js
          node <<'NODE'
          const fs = require('fs');
          for (const file of ['index.html', 'account.html']) {
            const html = fs.readFileSync(file, 'utf8');
            const blocks = [...html.matchAll(/<script\b(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi)];
            for (const block of blocks) new Function(block[1]);
            if (!blocks.length) throw new Error('No inline JavaScript found in ' + file);
          }
          console.log('GoGol inline JavaScript syntax is valid.');
          NODE

      - name: Validate GoGol release metadata and safety controls
        run: |
          node <<'NODE'
          const fs = require('fs');
          const version = JSON.parse(fs.readFileSync('version.json', 'utf8')).version;
          const html = fs.readFileSync('index.html', 'utf8');
          const sw = fs.readFileSync('sw.js', 'utf8');
          const migration = fs.readFileSync('supabase/migrations/20261116000300_user_safety_moderation.sql', 'utf8');
          const account = fs.readFileSync('account.html', 'utf8');
          if (!html.includes("const MADAL_VERSION='" + version + "'")) throw new Error('App version does not match version.json');
          if (!sw.includes("gogol-app-v" + version)) throw new Error('Service worker cache does not match version.json');
          for (const marker of ['data-report-post', 'data-block-user', 'data-unblock-user', 'privacySafetyCard', 'blockedUsersList']) {
            if (!html.includes(marker)) throw new Error('Missing safety feature: ' + marker);
          }
          for (const table of ['madal_user_blocks', 'madal_moderation_reports']) {
            if (!migration.includes('create table if not exists public.' + table)) throw new Error('Missing safety migration table: ' + table);
          }
          if (!account.includes('!/^[0-9]{6}$/.test(token)')) throw new Error('Phone OTP must accept exactly six digits');
          if (!html.includes('async function renderFeed()')) throw new Error('Feed renderer must be async to await social data');
          if (/\basync\s+function\s+rankForYouPosts\s*\(/.test(html)) throw new Error('For You ranking must be synchronous; renderFeed does not await it');
          if (!/\bfunction\s+rankForYouPosts\s*\(/.test(html)) throw new Error('Missing synchronous For You ranking function');
          if (!html.includes("activeFeedTab==='for_you'&&!query")) throw new Error('For You ranking is not connected to its feed tab');
          if (!html.includes(".range(from,to)")) throw new Error('Feed must load media in bounded pages');
          if (!html.includes(".order('id',{ascending:false})")) throw new Error('Feed pagination needs a stable tie-breaker');
          if (!html.includes("data-load-more")) throw new Error('Feed pagination control is missing');
          if (!html.includes('class="album-strip"') || !html.includes('album-hint')) throw new Error('Multi-photo album carousel is missing');
          if (!html.includes(".eq('album_id',p.album_id)")) throw new Error('Album viewer must load the complete published album');
          if (!html.includes("const feedScrollTop=append?$('allFeed').scrollTop:0")) throw new Error('Feed pagination must preserve the reader scroll position');
          if (!html.includes("const id=follow.dataset.discoverFollow,userId=currentUser.id")) throw new Error('Discover follow handler must capture the active user ID safely');
          if (!html.includes('function releaseUploadPreviewUrl()')) throw new Error('Upload preview object URLs must be released');
          if (!html.includes('releaseUploadPreviewUrl();')) throw new Error('Upload flow must release preview URLs');
          for (const marker of ['function clearUploadSelection()', 'clearUploadSelection();', 'function closeCameraStudio(cancelRecording=false)', "addEventListener('click',()=>closeCameraStudio(true))"]) {
            if (!html.includes(marker)) throw new Error('Missing upload/camera lifecycle safeguard: ' + marker);
          }
          if (migration.includes('madal_moderation_reports_target_required')) throw new Error('Report target constraint must not block ON DELETE SET NULL');
          if (!migration.includes('and (reported_user_id is not null or post_id is not null)')) throw new Error('Report insert policy must require a target');
          const controls = [...html.matchAll(/<(?:input|textarea|select)\b[^>]*>/gi)].map(match => match[0]);
          const accountControls = [...account.matchAll(/<(?:input|textarea|select)\b[^>]*>/gi)].map(match => match[0]);
          const unlabeled = [...controls, ...accountControls].filter(tag => !tag.includes('aria-label=') && !tag.includes('aria-labelledby='));
          if (unlabeled.length) throw new Error('Found form controls without explicit accessible labels: ' + unlabeled.join(' | '));
          const deletionMigration = fs.readFileSync('supabase/migrations/20261116000600_account_deletion_requests.sql', 'utf8');
          const profileMigration = fs.readFileSync('supabase/migrations/20261116000700_profile_storage.sql', 'utf8');
          const usernameMigration = fs.readFileSync('supabase/migrations/20261117000100_profile_username_conflicts.sql', 'utf8');
          const storiesMigration = fs.readFileSync('supabase/migrations/20261116000800_stories.sql', 'utf8');
          const deletionFunction = fs.readFileSync('supabase/functions/delete-account/index.ts', 'utf8');
          const storyCleanupFunction = fs.readFileSync('supabase/functions/cleanup-expired-stories/index.ts', 'utf8');
          const supabaseConfig = fs.readFileSync('supabase/config.toml', 'utf8');
          const liveClient = fs.readFileSync('live.js', 'utf8');
          const liveMigration = fs.readFileSync('supabase/migrations/20261116000900_live_streaming.sql', 'utf8');
          const liveLimitsMigration = fs.readFileSync('supabase/migrations/20261116001000_live_session_limits.sql', 'utf8');
          const liveTokenFunction = fs.readFileSync('supabase/functions/live-token/index.ts', 'utf8');
          if (!html.includes("db.functions.invoke('delete-account')")) throw new Error('Settings must call the secure account-deletion Edge Function');
          if (!deletionMigration.includes('create table if not exists public.madal_account_deletion_requests')) throw new Error('Account-deletion request migration is missing');
          for (const marker of ['authClient.auth.getUser()', 'SUPABASE_SERVICE_ROLE_KEY', 'admin.auth.admin.deleteUser(userId, false)', 'madal-media', 'madal-avatars']) {
            if (!deletionFunction.includes(marker)) throw new Error('Account-deletion server safeguard missing: ' + marker);
          }
          if (html.includes('SUPABASE_SERVICE_ROLE_KEY') || account.includes('SUPABASE_SERVICE_ROLE_KEY')) throw new Error('Service-role secret must never be shipped to clients');
          for (const marker of ['madal-avatars', 'MADAL avatar upload own folder', 'MADAL avatar images public read']) {
            if (!profileMigration.includes(marker)) throw new Error('Profile/avatar migration is missing: ' + marker);
          }
          for (const marker of ['create or replace function public.madal_create_profile()', 'when unique_violation', 'candidate_username', 'return new;']) {
            if (!usernameMigration.includes(marker)) throw new Error('Username collision migration is missing safeguard: ' + marker);
          }
          for (const marker of ['create table if not exists public.madal_stories', 'interval \'24 hours\'', 'GoGol active stories readable', 'GoGol users create own stories', 'GoGol users delete own stories', 'GoGol read active story media']) {
            if (!storiesMigration.includes(marker)) throw new Error('Stories migration is missing: ' + marker);
          }
          for (const marker of ['id="storyTray"', 'id="storyFile"', 'async function loadStories()', "db.from('madal_stories')", '24 saac kadib']) {
            if (!html.includes(marker)) throw new Error('Stories client feature is missing: ' + marker);
          }
          for (const marker of ['CRON_SECRET', 'SUPABASE_SERVICE_ROLE_KEY', 'madal_stories', 'expires_at', 'storage.from("madal-media").remove', 'constantTimeEqual']) {
            if (!storyCleanupFunction.includes(marker)) throw new Error('Expired Stories cleanup safeguard missing: ' + marker);
          }
          if (!supabaseConfig.includes('[functions.cleanup-expired-stories]') || !supabaseConfig.includes('verify_jwt = false')) throw new Error('Scheduled cleanup endpoint must be configured for its own CRON_SECRET authentication');
          if (!html.includes('<script type="module" src="./live.js"></script>')) throw new Error('GoGol LIVE client module is not connected to the app');
          for (const marker of ['livekit-client@2', 'madal_live_sessions', 'gLiveStart', 'gLiveEnd', 'gLiveChatForm', 'publishData', 'gLiveViewers', 'last_heartbeat_at']) {
            if (!liveClient.includes(marker)) throw new Error('GoGol LIVE client feature is missing: ' + marker);
          }
          if (!liveMigration.includes('create table if not exists public.madal_live_sessions')) throw new Error('GoGol LIVE database migration is missing');
          if (!liveLimitsMigration.includes('madal_live_sessions_one_active_per_host_idx')) throw new Error('GoGol LIVE active-session limit migration is missing');
          for (const marker of ['new AccessToken', 'LIVEKIT_API_SECRET', 'canPublish: body.role === "host"', 'canSubscribe: true', 'canPublishData: true']) {
            if (!liveTokenFunction.includes(marker)) throw new Error('GoGol LIVE token security is missing: ' + marker);
          }
          if (!supabaseConfig.includes('[functions.live-token]') || !supabaseConfig.includes('verify_jwt = true')) throw new Error('GoGol LIVE token function must require JWT verification');
          console.log('GoGol version, safety migrations, account deletion, Stories, LIVE, controls and accessibility labels are consistent.');
          NODE

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify Android APK and web update bundle
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | grep "package: name='com.madal.app'"
          "$APKSIGNER" verify --verbose "$APK"
          unzip -l madal-web.zip | grep -E 'index.html|update.js|version.json|live.js'

      - name: Read MADAL version
        id: version
        run: |
          VERSION=$(node -e "console.log(require('./version.json').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GoGol release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: GoGol ${{ steps.version.outputs.version }}
          target_commitish: main
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            madal-web.zip

      - name: Upload GoGol APK
        uses: actions/upload-artifact@v7
        with:
          name: GoGol-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
