name: Publish MADAL in-app update bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'account.html'
      - 'privacy.html'
      - 'community-guidelines.html'
      - 'terms.html'
      - 'update.js'
      - 'live.js'
      - 'manifest.webmanifest'
      - 'version.json'
      - 'sw.js'
      - 'gogol-logo.svg'
      - 'icon-*.png'
      - 'icons/**'
      - '.github/workflows/publish-web-update.yml'

permissions:
  contents: write

concurrency:
  group: madal-web-update
  cancel-in-progress: true

jobs:
  bundle:
    name: Build and publish MADAL web update
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MADAL
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Build web update bundle
        run: |
          mkdir -p www
          cp index.html account.html privacy.html community-guidelines.html terms.html update.js live.js gogol-logo.svg www/
          cp manifest.webmanifest version.json sw.js www/
          node --check live.js
          cp -r icons www/ 2>/dev/null || true
          npm init -y
          npm install @capacitor/core@8.6.2 @capawesome/capacitor-live-update@8.8.1
          npm install --save-dev esbuild@0.28.2
          npx esbuild update.js --bundle --format=esm --outfile=www/update.js
          cd www && zip -r ../madal-web.zip . && cd ..
          unzip -l madal-web.zip | grep -E 'index.html|account.html|privacy.html|community-guidelines.html|terms.html|update.js|version.json|live.js|gogol-logo.svg'

      - name: Read MADAL version
        id: version
        run: |
          VERSION=$(node -e "console.log(require('./version.json').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Require version bump for changed client assets
        id: release_guard
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            if ! git diff --quiet "$TAG"...HEAD -- index.html account.html privacy.html community-guidelines.html terms.html update.js live.js manifest.webmanifest sw.js gogol-logo.svg; then
              echo "Client files changed but version.json was not bumped. Increase the app version before publishing."
              exit 1
            fi
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No client changes; keeping the existing versioned web bundle."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish in-app update
        if: steps.release_guard.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: MADAL ${{ steps.version.outputs.version }}
          target_commitish: main
          make_latest: true
          overwrite_files: true
          files: madal-web.zip
