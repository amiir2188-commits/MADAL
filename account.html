<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>GoGol - Isdiiwaangeli ama Soo gal</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:25px;display:grid;place-items:center;background:#000;color:white;font-family:Arial,sans-serif}
main{width:100%;max-width:420px;background:#101010;padding:25px;border:1px solid #303030;border-radius:20px}
h1{text-align:center;color:#c4a5ff;font-size:38px}
h2{text-align:center}
p{text-align:center;color:#c7b8d9}
button,input{width:100%;padding:14px;margin:8px 0;border-radius:10px;font-size:16px}
input{background:#0c0815;color:white;border:1px solid #59436f}
button{border:0;background:#9b59e8;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.tabs{display:flex;gap:10px}
.tabs button{background:#352344}
#status{font-size:14px;line-height:1.5}
a{color:#c4a5ff}
:root{color-scheme:dark;--bg:#000;--panel:#111;--panel2:#1b1b1b}html,body{background:#000!important}</style>
</head>
<body>
<main>
<h1>GoGol</h1>
<p>Halkan kula wadaag sawirro, fiidiyowyo iyo daqiiqadaha noloshaada; kuna xirnow bulshada GoGol.</p>
<div class="tabs">
<button type="button" onclick="mode('signup')">Isdiiwaangeli</button>
<button type="button" onclick="mode('login')">Soo gal</button>
</div>
<h2 id="heading">Ku biir GoGol</h2>
<form id="form">
<div id="extra">
<input id="name" placeholder="Magacaaga" autocomplete="name" required aria-label="Magacaaga">
<input id="username" placeholder="Magaca isticmaalaha (tusaale: amiir01)" autocomplete="username" required aria-label="Magaca isticmaalaha">
</div>
<input id="identity" type="text" placeholder="Email ama telefoon (+252...)" autocomplete="username" required aria-label="Email ama lambarka telefoonka">
<div id="emailVerify" style="display:none"><p>Koodh xaqiijin oo 6 lambar ah ayaa emailkaaga loo diray.</p><input id="emailCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="Geli koodhka 6-da lambar ah ee emailka" aria-label="Koodhka xaqiijinta emailka"><button id="verifyEmail" type="button">Xaqiiji emailka</button><button id="resendEmail" type="button" style="background:#352344">Mar kale dir koodhka</button></div>
<div id="phoneVerify" style="display:none"><p>Koodh xaqiijin oo 6 lambar ah ayaa SMS lagugu soo diray.</p><input id="phoneCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="Geli koodhka 6-da lambar ah ee SMS-ka" aria-label="Koodhka xaqiijinta SMS-ka"><button id="verifyPhone" type="button">Xaqiiji telefoonka</button><button id="resendPhone" type="button" style="background:#352344">Mar kale dir SMS-ka</button></div>
<input id="password" type="password" placeholder="Furaha sirta ah (ugu yaraan 8 xaraf)" minlength="8" autocomplete="new-password" required aria-label="Furaha sirta ah">
<div id="policyConsentWrap" style="margin:12px 0;display:flex;align-items:flex-start;gap:10px;text-align:left"><input id="policyConsent" type="checkbox" required style="width:20px;min-width:20px;margin:3px 0" aria-label="Aqbal shuruudaha iyo siyaasadda asturnaanta"><label for="policyConsent" style="font-size:14px;line-height:1.5">Waxaan aqbalay <a href="./terms.html" target="_blank" rel="noopener">Shuruudaha Isticmaalka</a> iyo <a href="./privacy.html" target="_blank" rel="noopener">Siyaasadda Asturnaanta</a>.</label></div>
<button id="submit" type="submit">Isdiiwaangeli</button>
</form>
<p id="status" role="status" aria-live="polite"></p>
<p><a href="./index.html">Ku noqo GoGol</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://nxtnfdyksskofjbvface.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_IGs6B3ozDGNZtAQaL4uZaQ_jXlMqOeJ";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let currentMode="signup";
function mode(value){
 currentMode=value;
 document.getElementById("extra").style.display=value==="signup"?"block":"none";
 document.getElementById("heading").textContent=value==="signup"?"Ku biir GoGol":"Ku soo dhawoow mar kale GoGol";
 document.getElementById("submit").textContent=value==="signup"?"Isdiiwaangeli":"Soo gal";
 document.getElementById("status").textContent="";
 document.getElementById("phoneVerify").style.display="none";
 document.getElementById("emailVerify").style.display="none";
 document.getElementById("policyConsentWrap").style.display=value==="signup"?"flex":"none";
 document.getElementById("policyConsent").required=value==="signup";
 document.getElementById("name").required=value==="signup";
 document.getElementById("username").required=value==="signup";
 document.getElementById("password").autocomplete=value==="signup"?"new-password":"current-password";
}
const requestedMode=new URLSearchParams(location.search).get("mode");
if(requestedMode==="login")mode("login");
else mode("signup");
function normalizeSomaliPhone(value){
 let phone=String(value||"").replace(/[\s()-]/g,"");
 if(phone.startsWith("00"))phone="+"+phone.slice(2);
 if(phone.startsWith("0"))phone="+252"+phone.slice(1);
 else if(phone.startsWith("252"))phone="+"+phone;
 else if(/^6[0-9]{8}$/.test(phone))phone="+252"+phone;
 return /^\+252[0-9]{9}$/.test(phone)?phone:null;
}
async function resendVerification(channel){
 const identity=document.getElementById("identity").value.trim();
 const status=document.getElementById("status");
 const button=document.getElementById(channel==="email"?"resendEmail":"resendPhone");
 let payload;
 if(channel==="email"){
  if(!identity.includes("@")){status.textContent="Marka hore geli Gmail/email sax ah.";return}
  payload={type:"signup",email:identity};
 }else{
  const phone=normalizeSomaliPhone(identity);
  if(!phone){status.textContent="Marka hore geli SIM number sax ah, tusaale +252612345678.";return}
  payload={type:"sms",phone};
 }
 button.disabled=true;status.textContent=channel==="email"?"Koodh cusub ayaa emailka loo dirayaa...":"Koodh cusub ayaa SMS ahaan loo dirayaa...";
 try{
  const {error}=await db.auth.resend(payload);
  if(error)throw error;
  status.textContent=channel==="email"?"Koodh cusub ayaa Gmail/emailkaaga loo diray.":"Koodh cusub ayaa SMS ahaan loogu diray SIM-kaaga.";
 }catch(error){
  status.textContent="Koodhka dib looma diri karin: "+(error.message||"Mar kale isku day.");
 }finally{button.disabled=false}
}
document.getElementById("resendEmail").addEventListener("click",()=>resendVerification("email"));
document.getElementById("resendPhone").addEventListener("click",()=>resendVerification("phone"));

document.getElementById("verifyEmail").addEventListener("click",async()=>{
 const email=document.getElementById("identity").value.trim();
 const token=document.getElementById("emailCode").value.trim();
 const status=document.getElementById("status"),btn=document.getElementById("verifyEmail");
 if(!email.includes("@")||!/^\d{6}$/.test(token)){status.textContent="Geli email sax ah iyo koodhka 6-da lambar ah.";return}
 btn.disabled=true;status.textContent="Emailka waa la xaqiijinayaa...";
 try{
  const {data,error}=await db.auth.verifyOtp({email,token,type:"signup"});
  if(error)throw error;
  if(!data.session)throw new Error("Xaqiijintu ma dhammaan. Fadlan mar kale isku day.");
  status.textContent="Emailka waa la xaqiijiyey. GoGol ayaa furmaya...";
  setTimeout(()=>location.replace("./index.html"),800);
 }catch(error){status.textContent="Khalad: "+(error.message||"Koodhka lama xaqiijin karin.");}
 finally{btn.disabled=false;}
});

document.getElementById("verifyPhone").addEventListener("click",async()=>{
 const identity=document.getElementById("identity").value.trim();
 const phone=normalizeSomaliPhone(identity);
 const token=document.getElementById("phoneCode").value.trim();
 const status=document.getElementById("status"),btn=document.getElementById("verifyPhone");
 if(!phone||!/^[0-9]{6}$/.test(token)){status.textContent="Hubi lambarka telefoonka iyo koodhka SMS-ka ee 6-da lambar ah.";return}
 btn.disabled=true;status.textContent="Telefoonka waa la xaqiijinayaa...";
 try{
  const {data,error}=await db.auth.verifyOtp({phone,token,type:"sms"});
  if(error)throw error;
  if(!data.session)throw new Error("Xaqiijintu ma dhammaan. Fadlan mar kale isku day.");
  status.textContent="Telefoonka waa la xaqiijiyey. GoGol ayaa furmaya...";
  setTimeout(()=>location.replace("./index.html"),800);
 }catch(error){status.textContent="Khalad: "+(error.message||"Koodhka lama xaqiijin karin.");}
 finally{btn.disabled=false;}
});

document.getElementById("form").addEventListener("submit",async e=>{
 e.preventDefault();
 const status=document.getElementById("status"),btn=document.getElementById("submit");
 btn.disabled=true;status.textContent="Fadlan sug...";
 try{
  const identity=document.getElementById("identity").value.trim();
  const isEmail=identity.includes("@");
  const phone=normalizeSomaliPhone(identity);
  const password=document.getElementById("password").value;
  if(currentMode==="signup"){
   if(!document.getElementById("policyConsent").checked)throw new Error("Waa inaad aqbashaa shuruudaha isticmaalka iyo siyaasadda asturnaanta.");
   const name=document.getElementById("name").value.trim();
   const username=document.getElementById("username").value.trim().toLowerCase().replace(/^@/,"");
   if(!/^[a-z0-9_]{3,24}$/.test(username))throw new Error("Magaca isticmaaluhu waa inuu ka koobnaadaa 3–24 xaraf, tirooyin ama _.");
   let data,error;
   if(isEmail){
    ({data,error}=await db.auth.signUp({email:identity,password,options:{data:{display_name:name,username}}}));
   }else{
    if(!phone)throw new Error("Geli email sax ah ama lambar Soomaali ah sida +252612345678.");
    ({data,error}=await db.auth.signUp({phone,password,options:{data:{display_name:name,username},channel:"sms"}}));
   }
   if(error)throw error;
   if(data.session){
    status.textContent="Akoonkaagu waa diyaar! GoGol ayaa furmaya...";
    setTimeout(()=>location.replace("./index.html"),900);
   }else if(!isEmail){
    document.getElementById("phoneVerify").style.display="block";
    status.textContent="Koodh SMS ah ayaa laguu diray. Geli si aad u xaqiijiso akoonkaaga.";
   }else{
    document.getElementById("emailVerify").style.display="block";
    status.textContent="Koodh 6 lambar ah ayaan emailkaaga u dirnay. Geli si aad u hawlgeliso akoonkaaga.";
   }
  }else{
   if(!isEmail&&!phone)throw new Error("Geli email sax ah ama lambar telefoon oo +252 ah.");
   const credentials=isEmail?{email:identity,password}:{phone,password};
   const {data,error}=await db.auth.signInWithPassword(credentials);
   if(error)throw error;
   if(!data.session)throw new Error("Soo geliddu ma dhammaystirmin. Mar kale isku day.");
   status.textContent="Waad soo gashay! GoGol ayaa furmaya...";
   setTimeout(()=>location.replace("./index.html"),700);
  }
 }catch(error){status.textContent="Khalad: "+(error.message||"Fadlan mar kale isku day.");}
 finally{btn.disabled=false;}
});
</script>
</body>
</html>
