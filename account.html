<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090512">
<title>GoGol - Sign up or Log in</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:25px;display:grid;place-items:center;background:#090512;color:white;font-family:Arial,sans-serif}
main{width:100%;max-width:420px;background:#191128;padding:25px;border:1px solid #493264;border-radius:20px}
h1{text-align:center;color:#c4a5ff;font-size:38px}
h2{text-align:center}
p{text-align:center;color:#c7b8d9}
button,input{width:100%;padding:14px;margin:8px 0;border-radius:10px;font-size:16px}
input{background:#0c0815;color:white;border:1px solid #59436f}
button{border:0;background:#9b59e8;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.tabs{display:flex;gap:10px}
.tabs button{background:#352344}
#status{font-size:14px;line-height:1.5}
a{color:#c4a5ff}
</style>
</head>
<body>
<main>
<h1>GoGol</h1>
<p>Somali videos and stories come together here.</p>
<div class="tabs">
<button type="button" onclick="mode('signup')">Sign up</button>
<button type="button" onclick="mode('login')">Log in</button>
</div>
<h2 id="heading">Join GoGol</h2>
<form id="form">
<div id="extra">
<input id="name" placeholder="Your name" autocomplete="name" required>
<input id="username" placeholder="Username (tusaale: amiir01)" autocomplete="username" required>
</div>
<input id="identity" type="text" placeholder="Email or phone number (+252...)" autocomplete="username" required>
<div id="emailVerify" style="display:none"><p>A 6-digit code was sent to your email.</p><input id="emailCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="Enter the 6-digit email code"><button id="verifyEmail" type="button">Verify email</button></div>
<div id="phoneVerify" style="display:none"><p>A 6-digit code was sent by SMS.</p><input id="phoneCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="Enter the 6-digit SMS code"><button id="verifyPhone" type="button">Verify phone number</button></div>
<input id="password" type="password" placeholder="Password (at least 8 characters)" minlength="8" autocomplete="new-password" required>
<button id="submit" type="submit">Sign up</button>
</form>
<p id="status" role="status" aria-live="polite"></p>
<p><a href="./index.html">Back to GoGol</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://nxtnfdyksskofjbvface.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_IGs6B3ozDGNZtAQaL4uZaQ_jXlMqOeJ";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let currentMode="signup";
function mode(value){
 currentMode=value;
 document.getElementById("extra").style.display=value==="signup"?"block":"none";
 document.getElementById("heading").textContent=value==="signup"?"Join GoGol":"Welcome back to GoGol";
 document.getElementById("submit").textContent=value==="signup"?"Sign up":"Log in";
 document.getElementById("status").textContent="";
 document.getElementById("phoneVerify").style.display="none";
 document.getElementById("emailVerify").style.display="none";
 document.getElementById("name").required=value==="signup";
 document.getElementById("username").required=value==="signup";
 document.getElementById("password").autocomplete=value==="signup"?"new-password":"current-password";
}
function normalizeSomaliPhone(value){
 let phone=String(value||"").replace(/[\s()-]/g,"");
 if(phone.startsWith("00"))phone="+"+phone.slice(2);
 if(phone.startsWith("0"))phone="+252"+phone.slice(1);
 else if(phone.startsWith("252"))phone="+"+phone;
 else if(/^6[0-9]{8}$/.test(phone))phone="+252"+phone;
 return /^\+252[0-9]{9}$/.test(phone)?phone:null;
}
document.getElementById("verifyEmail").addEventListener("click",async()=>{
 const email=document.getElementById("identity").value.trim();
 const token=document.getElementById("emailCode").value.trim();
 const status=document.getElementById("status"),btn=document.getElementById("verifyEmail");
 if(!email.includes("@")||!/^\d{6}$/.test(token)){status.textContent="Enter a valid email and the 6-digit code.";return}
 btn.disabled=true;status.textContent="Verifying email...";
 try{
  const {data,error}=await db.auth.verifyOtp({email,token,type:"signup"});
  if(error)throw error;
  if(!data.session)throw new Error("Verification is incomplete. Please try again.");
  status.textContent="Email verified. Opening GoGol...";
  setTimeout(()=>location.replace("./index.html"),800);
 }catch(error){status.textContent="Error: "+(error.message||"The code could not be verified.");}
 finally{btn.disabled=false;}
});

document.getElementById("verifyPhone").addEventListener("click",async()=>{
 const identity=document.getElementById("identity").value.trim();
 const phone=normalizeSomaliPhone(identity);
 const token=document.getElementById("phoneCode").value.trim();
 const status=document.getElementById("status"),btn=document.getElementById("verifyPhone");
 if(!phone||!/^\\d{6}$/.test(token)){status.textContent="Check the phone number and 6-digit SMS code.";return}
 btn.disabled=true;status.textContent="Verifying phone number...";
 try{
  const {data,error}=await db.auth.verifyOtp({phone,token,type:"sms"});
  if(error)throw error;
  if(!data.session)throw new Error("Verification is incomplete. Please try again.");
  status.textContent="Phone number verified. Opening GoGol...";
  setTimeout(()=>location.replace("./index.html"),800);
 }catch(error){status.textContent="Error: "+(error.message||"The code could not be verified.");}
 finally{btn.disabled=false;}
});

document.getElementById("form").addEventListener("submit",async e=>{
 e.preventDefault();
 const status=document.getElementById("status"),btn=document.getElementById("submit");
 btn.disabled=true;status.textContent="Please wait...";
 try{
  const identity=document.getElementById("identity").value.trim();
  const isEmail=identity.includes("@");
  const phone=normalizeSomaliPhone(identity);
  const password=document.getElementById("password").value;
  if(currentMode==="signup"){
   const name=document.getElementById("name").value.trim();
   const username=document.getElementById("username").value.trim().toLowerCase().replace(/^@/,"");
   if(!/^[a-z0-9_]{3,24}$/.test(username))throw new Error("Username must be 3–24 characters and may contain letters, numbers, or _.");
   let data,error;
   if(isEmail){
    ({data,error}=await db.auth.signUp({email:identity,password,options:{data:{display_name:name,username}}}));
   }else{
    if(!phone)throw new Error("Enter a valid email or a Somali phone number such as +252612345678.");
    ({data,error}=await db.auth.signUp({phone,password,options:{data:{display_name:name,username},channel:"sms"}}));
   }
   if(error)throw error;
   if(data.session){
    status.textContent="Your account is ready! Opening GoGol...";
    setTimeout(()=>location.replace("./index.html"),900);
   }else if(!isEmail){
    document.getElementById("phoneVerify").style.display="block";
    status.textContent="An SMS code was sent to your number. Enter it to verify your account.";
   }else{
    document.getElementById("emailVerify").style.display="block";
    status.textContent="We sent a 6-digit code to your email. Enter it to activate your account.";
   }
  }else{
   if(!isEmail&&!phone)throw new Error("Enter a valid email or +252 phone number.");
   const credentials=isEmail?{email:identity,password}:{phone,password};
   const {data,error}=await db.auth.signInWithPassword(credentials);
   if(error)throw error;
   if(!data.session)throw new Error("Soo geliddu ma dhammaystirmin. Mar kale isku day.");
   status.textContent="You are signed in! Opening GoGol...";
   setTimeout(()=>location.replace("./index.html"),700);
  }
 }catch(error){status.textContent="Error: "+(error.message||"Please try again.");}
 finally{btn.disabled=false;}
});
</script>
</body>
</html>
